<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ClassWall - Consola de Lengua</title>
    <style>
        :root { --neon: #00ff41; --bg: #0d0d0d; }
        body { background-color: var(--bg); color: var(--neon); font-family: 'Courier New', Courier, monospace; padding: 20px; }
        .grid-juegos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { border: 1px solid var(--neon); padding: 20px; }
        .btn { background: transparent; color: var(--neon); border: 1px solid var(--neon); padding: 10px; cursor: pointer; }
        .btn:hover { background: var(--neon); color: black; }
        input { background: black; border: 1px solid var(--neon); color: var(--neon); padding: 10px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1>> ClassWall_Terminal</h1>
    <div id="grid-principal" class="grid-juegos"></div>
    <div id="contenedor-juego-activo" style="display:none;">
        <button class="btn" onclick="volverAlMenu()">[ VOLVER ]</button>
        <div id="area-juego-dinamico"></div>
    </div>

    <script>
        const listaJuegos = [
            {
                tipo: "input",
                titulo: "Ortografía: Tildes",
                categoria: "Nivel 1",
                desc: "Introduce la palabra correctamente acentuada.",
                preguntas: [
                    { enunciado: "¿Cómo se escribe 'cancion' con tilde?", respuesta: "canción" },
                    { enunciado: "¿Cómo se escribe 'lapiz' con tilde?", respuesta: "lápiz" }
                ]
            },
            {
                tipo: "test",
                titulo: "Sintaxis básica",
                categoria: "Nivel 2",
                desc: "Selecciona la opción correcta.",
                preguntas: [
                    { enunciado: "¿El sujeto de 'El gato corre'?", opcion: ["El gato", "corre"], correcta: 0 }
                ]
            }
        ];

        function cargarMenu() {
            document.getElementById('grid-principal').innerHTML = '';
            listaJuegos.forEach((j, i) => {
                document.getElementById('grid-principal').innerHTML += `
                    <div class="card">
                        <h3>${j.titulo}</h3>
                        <p>${j.desc}</p>
                        <button class="btn" onclick="iniciarJuego(${i})">EJECUTAR</button>
                    </div>
                `;
            });
        }

        function iniciarJuego(i) {
            document.getElementById('grid-principal').style.display = 'none';
            document.getElementById('contenedor-juego-activo').style.display = 'block';
            const j = listaJuegos[i];
            if (j.tipo === "test") ejecutarTest(j);
            else ejecutarInput(j);
        }

        function ejecutarInput(juego) {
            let pActual = 0;
            function mostrar() {
                if (pActual >= juego.preguntas.length) { areaJuego.innerHTML = "PROCESO FINALIZADO."; return; }
                const p = juego.preguntas[pActual];
                document.getElementById('area-juego-dinamico').innerHTML = `
                    <p>${p.enunciado}</p>
                    <input type="text" id="resp" onkeydown="if(event.key==='Enter') verificarInput('${p.respuesta}')">
                `;
            }
            window.verificarInput = function(correcta) {
                if (document.getElementById('resp').value.toLowerCase() === correcta.toLowerCase()) alert("ACCESO CONCEDIDO");
                else alert("ACCESO DENEGADO");
                pActual++; mostrar();
            }
            mostrar();
        }

        // ... (puedes mantener la función ejecutarTest anterior)
        cargarMenu();
    </script>
</body>
</html>
