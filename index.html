<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ClassWall - Lengua 2º ESO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* ESTÉTICA ORIGINAL (Modo Claro por defecto) */
        :root {
            --fondo: #f4f7f6;
            --texto: #2c3e50;
            --tarjeta: #ffffff;
            --acento: #3498db;
            --sombra: rgba(0, 0, 0, 0.05);
        }

        /* MODO OSCURO (Se activa con el botón) */
        body.dark {
            --fondo: #121212;
            --texto: #e0e0e0;
            --tarjeta: #1e1e1e;
            --acento: #3498db;
            --sombra: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--fondo);
            color: var(--texto);
            margin: 0;
            padding: 40px 20px;
            transition: background 0.3s, color 0.3s;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            margin-bottom: 5px;
            font-size: 2.5rem;
        }

        header p {
            color: #7f8c8d;
        }

        .btn-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--tarjeta);
            color: var(--texto);
            border: 2px solid var(--acento);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            box-shadow: 0 4px 6px var(--sombra);
        }

        .grid-juegos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: var(--tarjeta);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px var(--sombra);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--acento);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 15px;
            text-align: center;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-volver {
            background: #e74c3c;
            margin-bottom: 20px;
            width: auto;
            padding: 10px 20px;
        }

        input {
            background: var(--tarjeta);
            border: 2px solid var(--acento);
            color: var(--texto);
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            margin: 15px 0;
        }

        #contenedor-juego-activo {
            max-width: 600px;
            margin: 0 auto;
            background: var(--tarjeta);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px var(--sombra);
            display: none;
        }
    </style>
</head>
<body>

    <button class="btn-toggle" onclick="toggleTheme()">🌙 Cambiar Modo</button>

    <header id="cabecera">
        <h1>ClassWall</h1>
        <p>Portal de minijuegos de Lengua - 2º ESO</p>
    </header>

    <div id="grid-principal" class="grid-juegos"></div>

    <div id="contenedor-juego-activo">
        <button class="btn btn-volver" onclick="volverAlMenu()">⬅ Volver</button>
        <div id="area-juego-dinamico"></div>
    </div>

    <script>
        const juegos = [
            {
                tipo: "input",
                titulo: "Acentuación (Escritura)",
                desc: "Escribe la palabra correctamente acentuada.",
                preguntas: [
                    { enunciado: "¿Cómo se escribe 'lapiz' con tilde?", respuesta: "lápiz" },
                    { enunciado: "¿Cómo se escribe 'arbol' con tilde?", respuesta: "árbol" }
                ]
            },
            {
                tipo: "test",
                titulo: "Sintaxis (Test)",
                desc: "Selecciona la opción correcta.",
                preguntas: [
                    { enunciado: "En 'El perro ladra', ¿cuál es el sujeto?", opcion: ["El perro", "ladra"], correcta: 0 }
                ]
            }
        ];

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }

        function cargarMenu() {
            const grid = document.getElementById('grid-principal');
            grid.innerHTML = juegos.map((j, i) => `
                <div class="card">
                    <div>
                        <h3>${j.titulo}</h3>
                        <p>${j.desc}</p>
                    </div>
                    <button class="btn" onclick="iniciar(${i})">Jugar</button>
                </div>
            `).join('');
            grid.style.display = 'grid';
            document.getElementById('contenedor-juego-activo').style.display = 'none';
            document.getElementById('cabecera').style.display = 'block';
        }

        function iniciar(i) {
            document.getElementById('grid-principal').style.display = 'none';
            document.getElementById('cabecera').style.display = 'none';
            document.getElementById('contenedor-juego-activo').style.display = 'block';
            
            const j = juegos[i];
            let pIdx = 0;
            const area = document.getElementById('area-juego-dinamico');

            function mostrar() {
                if (pIdx >= j.preguntas.length) {
                    area.innerHTML = `<h2>¡Juego completado! 🎉</h2><button class='btn' onclick='volverAlMenu()'>Volver al menú</button>`;
                    return;
                }
                const p = j.preguntas[pIdx];
                
                if (j.tipo === "input") {
                    area.innerHTML = `
                        <h3>${j.titulo}</h3>
                        <p>Pregunta ${pIdx + 1} de ${j.preguntas.length}</p>
                        <p style="font-weight:600; margin-top:15px;">${p.enunciado}</p>
                        <input type="text" id="resp" placeholder="Escribe aquí y pulsa Enter..." onkeydown="if(event.key==='Enter') checkInput('${p.respuesta}')">
                    `;
                } else {
                    area.innerHTML = `
                        <h3>${j.titulo}</h3>
                        <p>Pregunta ${pIdx + 1} de ${j.preguntas.length}</p>
                        <p style="font-weight:600; margin-top:15px;">${p.enunciado}</p>
                        ${p.opcion.map((o, idx) => `<button class='btn' onclick='checkTest(${idx}, ${p.correcta})'>${o}</button>`).join('')}
                    `;
                }
            }

            window.checkInput = (corr) => {
                const val = document.getElementById('resp').value.trim();
                if (val.toLowerCase() === corr.toLowerCase()) {
                    alert("¡Correcto! ✅");
                } else {
                    alert("Incorrecto ❌. Era: " + corr);
                }
                pIdx++;
                mostrar();
            };

            window.checkTest = (sel, corr) => {
                if (sel === corr) {
                    alert("¡Correcto! ✅");
                } else {
                    alert("Incorrecto ❌");
                }
                pIdx++;
                mostrar();
            };

            mostrar();
        }

        function volverAlMenu() {
            cargarMenu();
        }

        cargarMenu();
    </script>
</body>
</html>
