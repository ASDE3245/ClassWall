<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ClassWall // Sistema de Lengua</title>
    <style>
        :root { --neon: #00ff41; --bg: #0d0d0d; }
        body { background-color: var(--bg); color: var(--neon); font-family: 'Courier New', Courier, monospace; padding: 20px; max-width: 800px; margin: auto; }
        .card { border: 1px solid var(--neon); padding: 20px; margin-bottom: 20px; }
        .btn { background: transparent; color: var(--neon); border: 1px solid var(--neon); padding: 10px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: var(--neon); color: black; }
        input { background: black; border: 1px solid var(--neon); color: var(--neon); padding: 10px; width: 100%; box-sizing: border-box; font-family: inherit; }
    </style>
</head>
<body>

    <h1>> ClassWall // SYSTEM_READY</h1>
    <div id="pantalla"></div>

    <script>
        const juegos = [
            {
                tipo: "input",
                titulo: "CORE_ACENTUACION",
                desc: "Ingresa la palabra con la tilde correcta.",
                preguntas: [
                    { enunciado: "Escribe 'arbol' correctamente:", respuesta: "árbol" },
                    { enunciado: "Escribe 'examen' (plural):", respuesta: "exámenes" }
                ]
            },
            {
                tipo: "test",
                titulo: "CORE_SINTAXIS",
                desc: "Identifica el sujeto.",
                preguntas: [
                    { enunciado: "En 'El perro ladra', ¿quién es el sujeto?", opcion: ["El perro", "ladra"], correcta: 0 }
                ]
            }
        ];

        function renderMenu() {
            let html = "<h2>> SELECCIONE MÓDULO:</h2>";
            juegos.forEach((j, i) => {
                html += `<div class="card"><h3>${j.titulo}</h3><p>${j.desc}</p><button class="btn" onclick="iniciar(${i})">INICIAR</button></div>`;
            });
            document.getElementById('pantalla').innerHTML = html;
        }

        function iniciar(i) {
            const j = juegos[i];
            let pIdx = 0;
            
            function mostrar() {
                if (pIdx >= j.preguntas.length) { renderMenu(); return; }
                const p = j.preguntas[pIdx];
                let content = `<h2>> ${j.titulo}</h2><p>${p.enunciado}</p>`;
                
                if (j.tipo === "input") {
                    content += `<input type="text" id="in" onkeydown="if(event.key==='Enter') checkInput('${p.respuesta}')">`;
                } else {
                    p.opcion.forEach((opt, idx) => {
                        content += `<button class="btn" onclick="checkTest(${idx}, ${p.correcta})">${opt}</button><br>`;
                    });
                }
                document.getElementById('pantalla').innerHTML = content;
            }

            window.checkInput = (corr) => {
                const val = document.getElementById('in').value;
                alert(val.toLowerCase() === corr.toLowerCase() ? "ACCESS_GRANTED" : "ACCESS_DENIED");
                pIdx++; mostrar();
            };

            window.checkTest = (sel, corr) => {
                alert(sel === corr ? "SUCCESS" : "FAILURE");
                pIdx++; mostrar();
            };

            mostrar();
        }

        renderMenu();
    </script>
</body>
</html>
